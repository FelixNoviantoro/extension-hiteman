<!DOCTYPE html>
<html>
  <head>
    <title>Web Recorder</title>
    <style>
      body {
        width: 400px;
        padding: 20px;
        font-family: Arial, sans-serif;
      }
      .input-group {
        margin-bottom: 15px;
      }
      input[type="url"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="input-group">
      <h3>Masukkan URL untuk direkam:</h3>
      <input type="url" id="urlInput" placeholder="https://example.com">
    </div>
    <button id="startRecord">Buka & Mulai Rekam</button>
    <script src="popup.js"></script>
  </body>
</html>
